name: CI/CD Pipeline - Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. BUILD & TEST FRONTEND (REACT / VITE + E2E)
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest

    # Service PostgreSQL éphémère pour les tests Playwright
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: battle_creator_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- ÉTAPE A : DÉMARRER L'API SPRING BOOT POUR PLAYWRIGHT ---
      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Lancement du Backend Spring Boot en arrière-plan
        working-directory: ./Backend/developpement
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/battle_creator_db
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
          PORT: 8080
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run &

      - name: Attente du démarrage de l'API Spring Boot
        run: |
          echo "Attente que l'API réponde sur le port 8080..."
          timeout 60s bash -c 'until curl -s http://localhost:8080 ; do sleep 2; done' || true

      # --- ÉTAPE B : EXÉCUTER PLAYWRIGHT ET BUILDER LE FRONT ---
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/developpement/package-lock.json'

      - name: Installation des dépendances Frontend
        working-directory: ./Frontend/developpement
        run: npm ci

      - name: Installation des navigateurs Playwright
        working-directory: ./Frontend/developpement
        run: npx playwright install --with-deps

      - name: Exécution des tests Playwright
        working-directory: ./Frontend/developpement
        env:
          VITE_API_URL: http://localhost:8080
        run: npx playwright test

      - name: Build du Frontend
        working-directory: ./Frontend/developpement
        run: npm run build

      - name: Sauvegarde de l'artefact Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./Frontend/developpement/dist

  # ==========================================
  # 2. BUILD & TEST BACKEND (SPRING BOOT)
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend/developpement

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Donner les permissions d'exécution à Maven Wrapper
        run: chmod +x mvnw

      - name: Build et Tests du Backend
        run: ./mvnw clean package -DskipTests=false

      - name: Sauvegarde de l'artefact JAR Backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./Backend/developpement/target/*.jar

  # ==========================================
  # 3. DEPLOIEMENT FRONTEND SUR ALWAYSDATA
  # ==========================================
  deploy-frontend:
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l'artefact Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Déploiement via SSH / SFTP (Alwaysdata Front)
        uses: meaganewaller/deploy-via-scp@v1.0.0
        with:
          host: ${{ secrets.FRONT_SSH_HOST }}
          username: ${{ secrets.FRONT_SSH_USER }}
          password: ${{ secrets.FRONT_SSH_PASSWORD }}
          source: "./dist/*"
          target: "/www/frontend/dist"

  # ==========================================
  # 4. DEPLOIEMENT BACKEND SUR ALWAYSDATA
  # ==========================================
  deploy-backend:
    needs: build-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l'artefact Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jar

      - name: Déploiement JAR via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACK_SSH_HOST }}
          username: ${{ secrets.BACK_SSH_USER }}
          password: ${{ secrets.BACK_SSH_PASSWORD }}
          source: "./jar/*.jar"
          target: "/home/${{ secrets.BACK_SSH_USER }}/backend"
          strip_components: 1

      - name: Redémarrage du site Spring Boot sur Alwaysdata
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACK_SSH_HOST }}
          username: ${{ secrets.BACK_SSH_USER }}
          password: ${{ secrets.BACK_SSH_PASSWORD }}
          script: |
            mkdir -p /home/${{ secrets.BACK_SSH_USER }}/backend
            mv /home/${{ secrets.BACK_SSH_USER }}/backend/*.jar /home/${{ secrets.BACK_SSH_USER }}/backend/app.jar
            touch /home/${{ secrets.BACK_SSH_USER }}/backend/app.jar
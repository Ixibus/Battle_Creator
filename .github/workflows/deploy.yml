name: CI/CD Pipeline - Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. BUILD & TEST FRONTEND (REACT / VITE + E2E)
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: battle_creator_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- ÉTAPE A : DÉMARRER L'API SPRING BOOT POUR PLAYWRIGHT ---
      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build de l'application Backend pour tests E2E
        working-directory: ./Backend/developpement
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Lancement du Backend Spring Boot en arrière-plan (Profil Test / H2)
        working-directory: ./Backend/developpement
        run: |
          java -Dspring.profiles.active=test -jar target/*.jar > backend.log 2>&1 &
        env:
          SERVER_PORT: 8080
          SECURITY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_TEST }}
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD:

      - name: Attente du démarrage complet de l'API Spring Boot (max 1 min)
        run: |
          echo "Attente que l'API réponde sur HTTP..."
          # npx wait-on http://127.0.0.1:8080 attend une vraie réponse HTTP et non juste le port TCP
          npx wait-on http://127.0.0.1:8080/auth/register --timeout 60000 || {
            echo "❌ Le backend a planté ou n'a pas répondu à temps !"
            echo "=== LOGS DU BACKEND (backend.log) ==="
            cat ./Backend/developpement/backend.log
            exit 1
          }
          echo "✅ Backend prêt !"

      - name: Vérification du processus Java et des logs avant Playwright
        run: |
          echo "=== VERIFICATION PROCESSUS JAVA ==="
          ps aux | grep java
          echo "=== DERNIERES LIGNES DES LOGS BACKEND ==="
          tail -n 30 ./Backend/developpement/backend.log

      # --- ÉTAPE B : EXÉCUTER PLAYWRIGHT ET BUILDER LE FRONT ---
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/developpement/package-lock.json'

      - name: Installation des dépendances Frontend
        working-directory: ./Frontend/developpement
        run: npm ci

      - name: Installation des navigateurs Playwright
        working-directory: ./Frontend/developpement
        run: npx playwright install --with-deps

      - name: Exécution des tests Playwright
        working-directory: ./Frontend/developpement
        env:
          VITE_API_URL: http://127.0.0.1:8080
        run: npx playwright test

      - name: Afficher les logs Spring Boot après les tests
        if: always()
        run: |
          echo "=== LOGS BACKEND SPRING BOOT ==="
          cat ./Backend/developpement/backend.log

      - name: Build du Frontend
        working-directory: ./Frontend/developpement
        run: npm run build

      - name: Sauvegarde de l'artefact Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./Frontend/developpement/dist

  # ==========================================
  # 2. BUILD & TEST BACKEND (SPRING BOOT)
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend/developpement

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Donner les permissions d'exécution à Maven Wrapper
        run: chmod +x mvnw

      - name: Build et Tests du Backend (avec H2)
        env:
          SECURITY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_TEST }}
        run: ./mvnw clean package -DskipTests=false

      - name: Sauvegarde de l'artefact JAR Backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./Backend/developpement/target/*.jar

  # ==========================================
  # 3. DÉPLOIEMENT FRONTEND SUR ALWAYSDATA
  # ==========================================
  deploy-frontend:
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l'artefact Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Déploiement via SSH / SFTP (Alwaysdata Front)
        uses: meaganewaller/deploy-via-scp@v1.0.0
        with:
          host: ${{ secrets.FRONT_SSH_HOST }}
          username: ${{ secrets.FRONT_SSH_USER }}
          password: ${{ secrets.FRONT_SSH_PASSWORD }}
          source: "./dist/*"
          target: "/www/frontend/dist"

  # ==========================================
  # 4. DÉPLOIEMENT BACKEND SUR ALWAYSDATA
  # ==========================================
  deploy-backend:
    needs: build-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l'artefact Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jar

      - name: Déploiement JAR via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACK_SSH_HOST }}
          username: ${{ secrets.BACK_SSH_USER }}
          password: ${{ secrets.BACK_SSH_PASSWORD }}
          source: "./jar/*.jar"
          target: "/home/${{ secrets.BACK_SSH_USER }}/backend"
          strip_components: 1

      - name: Redémarrage du site Spring Boot sur Alwaysdata
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACK_SSH_HOST }}
          username: ${{ secrets.BACK_SSH_USER }}
          password: ${{ secrets.BACK_SSH_PASSWORD }}
          script: |
            mkdir -p /home/${{ secrets.BACK_SSH_USER }}/backend
            mv /home/${{ secrets.BACK_SSH_USER }}/backend/*.jar /home/${{ secrets.BACK_SSH_USER }}/backend/app.jar
            touch /home/${{ secrets.BACK_SSH_USER }}/backend/app.jar
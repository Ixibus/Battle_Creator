name: "Test Frontend"
description: "Installation des dépendances et lancement des tests du Frontend"

runs:
  using: "composite"
  steps:
    - name: Configuration de Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: "Frontend/developpement/package-lock.json"

    - name: Installation des dépendances
      shell: bash
      working-directory: Frontend/developpement
      run: npm ci

    - name: Exécution des tests unitaires (Vitest)
      shell: bash
      working-directory: Frontend/developpement
      run: npm test

    - name: Installation des navigateurs Playwright
      shell: bash
      working-directory: Frontend/developpement
      run: npx playwright install --with-deps

    - name: Configuration de Java pour la génération du JAR
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
        cache: "maven"

    - name: Génération du JAR Spring Boot
      shell: bash
      working-directory: Backend/developpement
      run: mvn package -DskipTests

    - name: Démarrage de l'application via Docker Compose (utilisation secrets)
      shell: bash
      working-directory: Backend/developpement
      env:
        SPRING_DATASOURCE_URL: ${{secrets.SPRING_DATASOURCE_URL}}
        SPRING_DATASOURCE_USERNAME: ${{secrets.SPRING_DATASOURCE_USERNAME}}
        SPRING_DATASOURCE_PASSWORD: ${{secrets.SPRING_DATASOURCE_PASSWORD}}
      run: docker compose up -d --build

    - name: Attente du démarrage du backend Spring Boot
      shell: bash
      run: |
          echo "Attente que l'API réponde sur HTTP..."
          # npx wait-on http-get://127.0.0.1:8080 attend une vraie réponse HTTP et non juste le port TCP
          npx wait-on http-get://127.0.0.1:8080/healthCheckForWaitOn --timeout 60000 || {
            echo "❌ Le backend a planté ou n'a pas répondu à temps !"
            echo "=== LOGS DU BACKEND (backend.log) ==="
            cat ./Backend/developpement/backend.log
            exit 1
          }
          echo "✅ Backend prêt !"

    - name: Affichage des logs Docker (si échec)
      if: failure()
      shell: bash
      working-directory: Backend/developpement
      run: docker compose logs

    - name: Exécution des tests E2E (Playwright)
      shell: bash
      working-directory: Frontend/developpement
      run: npm run test:e2e
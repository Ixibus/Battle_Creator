name: "Test Frontend"
description: "Installation des dépendances et lancement des tests du Frontend"

runs:
  using: "composite"
  steps:
    - name: Configuration de Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: "Frontend/developpement/package-lock.json"

    - name: Installation des dépendances
      shell: bash
      working-directory: Frontend/developpement
      run: npm ci

    - name: Exécution des tests unitaires (Vitest)
      shell: bash
      working-directory: Frontend/developpement
      run: npm test

    - name: Installation des navigateurs Playwright
      shell: bash
      working-directory: Frontend/developpement
      run: npx playwright install --with-deps

    - name: Démarrage de l'application via Docker Compose
      shell: bash
      run: docker compose up -d --build

    - name: Attente du démarrage du backend Spring Boot
      shell: bash
      run: |
        echo "Attente du backend..."
        npx wait-on http://localhost:8080 --timeout 60000

    - name: Exécution des tests E2E (Playwright)
      shell: bash
      working-directory: Frontend/developpement
      run: npm run test:e2e
# Connexion à la base (valeurs par défaut pour l'environnement Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_battle_creator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Désactive le lazy initialization pour voir les erreurs au boot
spring.main.lazy-initialization=false

# Auto-création des tables pour les tests CI
spring.jpa.hibernate.ddl-auto=update

# Re-facilite la détection de métadonnées
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
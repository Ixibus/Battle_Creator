spring.application.name=battlecreator

# Port d'écoute
server.port=${PORT:8080}


# Connexion à la base (valeurs par défaut pour l'environnement Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db_battle_creator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

## Configuration JPA / Hibernate
spring.jpa.defer-datasource-initialization=true
# Active le Lazy Initialization global
spring.main.lazy-initialization=true
# Évite que Hibernate ne bloque le démarrage si la BDD met du temps à répondre (Ne charge pas d'un coup les métadonnées de la BDD)
spring.jpa.open-in-view=false
# Empêche Hibernate de scanner/valider la BDD au démarrage
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Empêche HikariCP de bloquer le démarrage si la BDD répond lentement
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=30000
# Limite HikariCP pour réduire l'empreinte RAM de la BDD
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Limite les ressources de Tomcat embarqué
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100

# JWT
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:9c14cadd104b002192aedcd27ecbfd23a80ff96095c3eb6403b9b18261d1b264}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:86400000}

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://ixibus157.alwaysdata.net